<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demander un devis — Omnira Agents vocaux IA</title>
  <meta name="description" content="Demandez votre devis personnalisé pour un agent vocal IA adapté à votre activité. Omnira évalue votre besoin et vous propose une solution sur mesure."/>
  <link rel="canonical" href="https://omniragency.com/devis"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="64x64" href="uploads/omnira-logo-transparent.png"/>
  <link rel="apple-touch-icon" href="uploads/omnira-logo-transparent.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #0B1726; -webkit-font-smoothing: antialiased; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.75; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.5; transform: translateY(-50%) scale(1); } 50% { opacity: 1; transform: translateY(-50%) scale(1.04); } }
    @keyframes particleDrift { from { transform: translateY(0px) translateX(0px); opacity: 0.2; } to { transform: translateY(-18px) translateX(8px); opacity: 0.5; } }
    @media (max-width: 900px) {
      .hero-grid    { grid-template-columns: 1fr !important; }
      .solution-grid{ grid-template-columns: 1fr !important; }
      .footer-grid  { grid-template-columns: 1fr !important; }
      .nav-links    { display: none !important; }
      .form-grid    { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components/brand.jsx"></script>
  <script type="text/babel" src="components/nav-hero.jsx"></script>
  <script type="text/babel" src="components/pricing-bottom.jsx"></script>
  <script type="text/babel">
    function DevisPage() {
      React.useEffect(() => {
        var tries = 0;
        var tryInline = function() {
          if (window.Cal) {
            Cal("init", "devis-inline", { origin: "https://cal.com" });
            Cal.ns["devis-inline"]("inline", {
              elementOrSelector: "#cal-inline-devis",
              calLink: "babacar-faye-qh9cu1/devis-omnira",
              config: { layout: "month_view" }
            });
            Cal.ns["devis-inline"]("ui", { theme: "light", styles: { branding: { brandColor: "#1E73D8" } }, hideEventTypeDetails: false });
          } else if (tries++ < 20) {
            setTimeout(tryInline, 300);
          }
        };
        tryInline();
      }, []);

      return (
        <main style={{paddingTop:'80px',background:B.bgD,minHeight:'100vh',position:'relative',overflow:'hidden'}}>
          <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 70% 40% at 50% 0%,rgba(30,115,216,0.18),transparent 60%)',pointerEvents:'none'}}/>
          <div style={{position:'absolute',inset:0,backgroundImage:'linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px)',backgroundSize:'64px 64px'}}/>

          <div style={{maxWidth:'900px',margin:'0 auto',padding:'64px 24px 96px',position:'relative',zIndex:1}}>
            <div style={{textAlign:'center',marginBottom:'48px'}}>
              <div style={{marginBottom:'16px'}}><Chip color={B.cyan}>Devis personnalisé</Chip></div>
              <h1 style={{fontFamily:'Sora,sans-serif',fontSize:'clamp(28px,4vw,44px)',fontWeight:800,color:'white',letterSpacing:'-0.022em',lineHeight:1.15,marginBottom:'16px'}}>
                Demandez votre devis<br/>personnalisé
              </h1>
              <p style={{fontFamily:'Inter,sans-serif',fontSize:'16px',color:'rgba(255,255,255,0.42)',lineHeight:1.7}}>
                Choisissez un créneau et répondez aux quelques questions. Omnira analyse votre situation et prépare votre estimation.
              </p>
            </div>

            <div id="cal-inline-devis" style={{width:'100%',minHeight:'650px',borderRadius:'20px',overflow:'hidden',background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)'}}/>
          </div>
        </main>
      );
    }

    function App() {
      return (
        <div>
          <Nav/>
          <DevisPage/>
          <Footer/>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
