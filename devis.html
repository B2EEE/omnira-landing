<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demander un devis — Omnira Agents vocaux IA</title>
  <meta name="description" content="Demandez votre devis personnalisé pour un agent vocal IA adapté à votre activité. Omnira évalue votre besoin et vous propose une solution sur mesure."/>
  <link rel="canonical" href="https://omniragency.com/devis"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="64x64" href="uploads/omnira-logo-transparent.png"/>
  <link rel="apple-touch-icon" href="uploads/omnira-logo-transparent.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #0B1726; -webkit-font-smoothing: antialiased; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.75; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.5; transform: translateY(-50%) scale(1); } 50% { opacity: 1; transform: translateY(-50%) scale(1.04); } }
    @keyframes particleDrift { from { transform: translateY(0px) translateX(0px); opacity: 0.2; } to { transform: translateY(-18px) translateX(8px); opacity: 0.5; } }
    @media (max-width: 900px) {
      .hero-grid    { grid-template-columns: 1fr !important; }
      .solution-grid{ grid-template-columns: 1fr !important; }
      .footer-grid  { grid-template-columns: 1fr !important; }
      .nav-links    { display: none !important; }
      .form-grid    { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components/brand.jsx"></script>
  <script type="text/babel" src="components/nav-hero.jsx"></script>
  <script type="text/babel" src="components/pricing-bottom.jsx"></script>
  <script type="text/babel">

    const BESOINS = [
      'Répondre aux appels',
      'Prendre des rendez-vous',
      'Préparer des devis',
      'Filtrer les urgences',
      'Qualifier les demandes',
      'Automatiser les rappels',
      'Autre',
    ];
    const OUTILS = [
      'Google Calendar',
      'CRM',
      'Google Sheets',
      'Email',
      'SMS',
      'Logiciel métier',
      'Aucun pour l\'instant',
      'Autre',
    ];

    function DevisPage() {
      const [form, setForm] = React.useState({
        nom:'', entreprise:'', email:'', tel:'',
        secteur:'', appelsParJour:'', problemePrincipal:'',
        besoins:[], outils:[], appelsSortants:'', message:'',
      });
      const [sent, setSent]       = React.useState(false);
      const [loading, setLoading] = React.useState(false);

      const set = k => e => setForm(f=>({...f,[k]:e.target.value}));
      const toggleCheck = (k, val) => setForm(f=>({
        ...f,
        [k]: f[k].includes(val) ? f[k].filter(x=>x!==val) : [...f[k],val],
      }));

      const submit = e => {
        e.preventDefault();
        setLoading(true);
        setTimeout(()=>{ setLoading(false); setSent(true); window.scrollTo({top:0,behavior:'smooth'}); }, 1200);
      };

      const inputStyle = {
        width:'100%',padding:'13px 16px',borderRadius:'12px',border:`1px solid ${B.border}`,
        fontFamily:'Inter,sans-serif',fontSize:'14px',color:B.tMain,background:B.bgW,
        outline:'none',boxSizing:'border-box',transition:'border-color 0.18s',
      };
      const labelStyle = {
        display:'block',fontFamily:'Sora,sans-serif',fontSize:'12px',fontWeight:700,
        color:B.tMuted,marginBottom:'8px',textTransform:'uppercase',letterSpacing:'0.08em',
      };

      return (
        <main style={{paddingTop:'80px',background:B.bgD,minHeight:'100vh',position:'relative',overflow:'hidden'}}>
          <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 70% 40% at 50% 0%,rgba(30,115,216,0.18),transparent 60%)',pointerEvents:'none'}}/>
          <div style={{position:'absolute',inset:0,backgroundImage:'linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px)',backgroundSize:'64px 64px'}}/>

          <div style={{maxWidth:'720px',margin:'0 auto',padding:'64px 24px 96px',position:'relative',zIndex:1}}>
            {/* Hero text */}
            <div style={{textAlign:'center',marginBottom:'56px'}}>
              <div style={{marginBottom:'16px'}}><Chip color={B.cyan}>Devis personnalisé</Chip></div>
              <h1 style={{fontFamily:'Sora,sans-serif',fontSize:'clamp(28px,4vw,44px)',fontWeight:800,color:'white',letterSpacing:'-0.022em',lineHeight:1.15,marginBottom:'16px'}}>
                Demandez votre devis<br/>personnalisé
              </h1>
              <p style={{fontFamily:'Inter,sans-serif',fontSize:'16px',color:'rgba(255,255,255,0.42)',lineHeight:1.7}}>
                Décrivez votre activité et vos besoins. Omnira analyse votre situation et vous propose une estimation adaptée.
              </p>
            </div>

            {/* Form card */}
            <div style={{borderRadius:'24px',padding:'40px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.09)',backdropFilter:'blur(20px)',boxShadow:'0 32px 80px rgba(0,0,0,0.3)'}}>
              {sent ? (
                <div style={{textAlign:'center',padding:'48px 0',animation:'slideIn 0.4s ease'}}>
                  <div style={{width:'72px',height:'72px',borderRadius:'50%',background:B.grad,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 24px',boxShadow:'0 8px 28px rgba(30,115,216,0.4)',color:'white'}}>
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M5 14l6 6 12-12" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </div>
                  <h2 style={{fontFamily:'Sora,sans-serif',fontSize:'22px',fontWeight:700,color:'white',marginBottom:'12px'}}>Demande bien envoyée !</h2>
                  <p style={{fontFamily:'Inter,sans-serif',fontSize:'15px',color:'rgba(255,255,255,0.45)',lineHeight:1.7,marginBottom:'36px'}}>
                    Omnira va analyser votre besoin et vous proposer une estimation adaptée.<br/>Vous pouvez aussi réserver directement un créneau de démo.
                  </p>
                  <GBtn href="/prendre-rendez-vous" variant="primary" size="lg">Réserver une démo</GBtn>
                </div>
              ) : (
                <form onSubmit={submit}>
                  {/* Identité */}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}} className="form-grid">
                    <div>
                      <label style={labelStyle}>Nom *</label>
                      <input required value={form.nom} onChange={set('nom')} placeholder="Dupont" style={inputStyle}
                        onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}/>
                    </div>
                    <div>
                      <label style={labelStyle}>Entreprise *</label>
                      <input required value={form.entreprise} onChange={set('entreprise')} placeholder="Nom de votre entreprise" style={inputStyle}
                        onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}/>
                    </div>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}} className="form-grid">
                    <div>
                      <label style={labelStyle}>Email *</label>
                      <input required type="email" value={form.email} onChange={set('email')} placeholder="vous@entreprise.fr" style={inputStyle}
                        onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}/>
                    </div>
                    <div>
                      <label style={labelStyle}>Téléphone</label>
                      <input type="tel" value={form.tel} onChange={set('tel')} placeholder="06 XX XX XX XX" style={inputStyle}
                        onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}/>
                    </div>
                  </div>

                  {/* Activité */}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}} className="form-grid">
                    <div>
                      <label style={labelStyle}>Secteur d'activité *</label>
                      <select required value={form.secteur} onChange={set('secteur')} style={{...inputStyle,cursor:'pointer'}}
                        onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}>
                        <option value="">Choisir...</option>
                        {['Garage / Centre auto','Restaurant / Hôtel','Artisan / Service local','Cabinet médical ou paramédical','Immobilier / Agence','Commerce local','Autre'].map(o=><option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={labelStyle}>Appels reçus par jour</label>
                      <select value={form.appelsParJour} onChange={set('appelsParJour')} style={{...inputStyle,cursor:'pointer'}}
                        onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}>
                        <option value="">Estimer...</option>
                        {['Moins de 5','5 à 15','15 à 30','30 à 60','Plus de 60'].map(o=><option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>
                  </div>

                  <div style={{marginBottom:'20px'}}>
                    <label style={labelStyle}>Problème principal</label>
                    <input value={form.problemePrincipal} onChange={set('problemePrincipal')} placeholder="Ex. : appels manqués le soir, équipe interrompue, devis non suivis..." style={inputStyle}
                      onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}/>
                  </div>

                  {/* Besoins */}
                  <div style={{marginBottom:'20px'}}>
                    <label style={{...labelStyle,marginBottom:'12px'}}>Besoin principal (plusieurs choix possibles)</label>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}} className="form-grid">
                      {BESOINS.map(b=>{
                        const checked = form.besoins.includes(b);
                        return (
                          <label key={b} onClick={()=>toggleCheck('besoins',b)} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',borderRadius:'10px',cursor:'pointer',background:checked?'rgba(30,115,216,0.08)':'rgba(255,255,255,0.03)',border:`1px solid ${checked?'rgba(30,115,216,0.3)':'rgba(255,255,255,0.08)'}`,transition:'all 0.18s'}}>
                            <div style={{width:'18px',height:'18px',borderRadius:'5px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:checked?B.grad:'transparent',border:checked?'none':'1px solid rgba(255,255,255,0.2)',transition:'all 0.18s'}}>
                              {checked && <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-5" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                            </div>
                            <span style={{fontFamily:'Inter,sans-serif',fontSize:'13px',color:checked?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.4)',lineHeight:1.3,userSelect:'none'}}>{b}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  {/* Outils */}
                  <div style={{marginBottom:'20px'}}>
                    <label style={{...labelStyle,marginBottom:'12px'}}>Outils à connecter (plusieurs choix possibles)</label>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}} className="form-grid">
                      {OUTILS.map(o=>{
                        const checked = form.outils.includes(o);
                        return (
                          <label key={o} onClick={()=>toggleCheck('outils',o)} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',borderRadius:'10px',cursor:'pointer',background:checked?'rgba(30,115,216,0.08)':'rgba(255,255,255,0.03)',border:`1px solid ${checked?'rgba(30,115,216,0.3)':'rgba(255,255,255,0.08)'}`,transition:'all 0.18s'}}>
                            <div style={{width:'18px',height:'18px',borderRadius:'5px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:checked?B.grad:'transparent',border:checked?'none':'1px solid rgba(255,255,255,0.2)',transition:'all 0.18s'}}>
                              {checked && <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-5" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                            </div>
                            <span style={{fontFamily:'Inter,sans-serif',fontSize:'13px',color:checked?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.4)',lineHeight:1.3,userSelect:'none'}}>{o}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  {/* Appels sortants */}
                  <div style={{marginBottom:'20px'}}>
                    <label style={{...labelStyle,marginBottom:'12px'}}>Besoin d'appels sortants ?</label>
                    <div style={{display:'flex',gap:'12px'}}>
                      {['Oui','Non','Je ne sais pas encore'].map(opt=>{
                        const sel = form.appelsSortants===opt;
                        return (
                          <button key={opt} type="button" onClick={()=>setForm(f=>({...f,appelsSortants:opt}))}
                            style={{flex:1,padding:'10px 14px',borderRadius:'10px',border:`1px solid ${sel?'rgba(30,115,216,0.3)':'rgba(255,255,255,0.08)'}`,background:sel?'rgba(30,115,216,0.08)':'rgba(255,255,255,0.03)',cursor:'pointer',fontFamily:'Inter,sans-serif',fontSize:'13px',color:sel?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.4)',transition:'all 0.18s'}}>
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Message libre */}
                  <div style={{marginBottom:'32px'}}>
                    <label style={labelStyle}>Message libre (optionnel)</label>
                    <textarea value={form.message} onChange={set('message')} placeholder="Décrivez votre situation, vos contraintes spécifiques ou toute information utile..." rows={4}
                      style={{...inputStyle,resize:'vertical',minHeight:'96px'}}
                      onFocus={e=>e.target.style.borderColor=B.blue} onBlur={e=>e.target.style.borderColor=B.border}/>
                  </div>

                  <button type="submit" disabled={loading} style={{width:'100%',padding:'16px',borderRadius:'14px',border:'none',cursor:loading?'not-allowed':'pointer',background:B.grad,color:'white',fontFamily:'Sora,sans-serif',fontSize:'15px',fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:'10px',boxShadow:'0 8px 28px rgba(30,115,216,0.4)',transition:'all 0.18s',opacity:loading?0.75:1}}
                    onMouseEnter={e=>{if(!loading){e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 14px 36px rgba(30,115,216,0.5)';}}}
                    onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 8px 28px rgba(30,115,216,0.4)';}}>
                    {loading ? 'Envoi en cours…' : 'Envoyer ma demande de devis'}
                  </button>

                  <p style={{fontFamily:'Inter,sans-serif',fontSize:'12px',color:'rgba(255,255,255,0.25)',textAlign:'center',marginTop:'16px',lineHeight:1.5}}>
                    Vos informations sont confidentielles et utilisées uniquement pour préparer votre estimation.
                  </p>
                </form>
              )}
            </div>
          </div>
        </main>
      );
    }

    function App() {
      return (
        <div>
          <Nav/>
          <DevisPage/>
          <Footer/>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
