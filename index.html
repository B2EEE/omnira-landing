  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #0B1726; -webkit-font-smoothing: antialiased; }

    /* ── Keyframes ── */
    @keyframes barwave {
      0%, 100% { transform: scaleY(0.3); }
      50%       { transform: scaleY(1); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes ringPulse {
      0%, 100% { opacity: 0.45; transform: translateY(-50%) scale(1); }
      50%       { opacity: 0.85; transform: translateY(-50%) scale(1.04); }
    }
    @keyframes ping {
      0%   { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(2); opacity: 0; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes particleDrift {
      from { transform: translateY(0px) translateX(0px); opacity: 0.18; }
      to   { transform: translateY(-18px) translateX(8px); opacity: 0.45; }
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 6px 24px rgba(30,115,216,0.38), inset 0 1px 0 rgba(255,255,255,0.18); }
      50%       { box-shadow: 0 10px 38px rgba(47,199,214,0.58), inset 0 1px 0 rgba(255,255,255,0.22); }
    }
    @keyframes shimmerPass {
      0%   { left: -100%; }
      100% { left: 160%; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }
    @keyframes borderGlow {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }
    @keyframes countUp {
      from { opacity: 0; transform: translateY(6px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Boutons primary : glow animé ── */
    .btn-primary-glow { animation: glowPulse 3s ease-in-out infinite; }

    /* ── Slider ── */
    .omnira-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 99px;
      outline: none;
      cursor: pointer;
      width: 100%;
      background: linear-gradient(
        to right,
        var(--color) 0%,
        var(--color) var(--pct),
        #CCE0F0 var(--pct),
        #CCE0F0 100%
      );
    }
    .omnira-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: white;
      border: 2.5px solid var(--color, #1E73D8);
      box-shadow: 0 2px 12px rgba(30,115,216,0.28);
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s ease;
    }
    .omnira-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
      box-shadow: 0 4px 18px rgba(30,115,216,0.42);
    }
    .omnira-slider::-webkit-slider-thumb:active {
      transform: scale(0.95);
    }

    /* ── Séparateurs de section ── */
    .section-cap-top {
      position: relative;
    }
    .section-cap-top::before {
      content: '';
      display: block;
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(30,115,216,0.18) 25%, rgba(47,199,214,0.3) 50%, rgba(30,115,216,0.18) 75%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .hero-grid    { grid-template-columns: 1fr !important; }
      .pain-grid    { grid-template-columns: 1fr 1fr !important; }
      .feat-grid    { grid-template-columns: 1fr 1fr !important; }
      .solution-grid{ grid-template-columns: 1fr !important; }
      .demo-grid    { grid-template-columns: 1fr !important; }
      .roi-grid     { grid-template-columns: 1fr !important; }
      .test-grid    { grid-template-columns: 1fr !important; }
      .pricing-grid { grid-template-columns: 1fr !important; }
      .footer-grid  { grid-template-columns: 1fr !important; }
      .stats-grid   { grid-template-columns: 1fr 1fr !important; }
      .nav-links    { display: none !important; }
      .form-grid    { grid-template-columns: 1fr !important; }
      .founders-grid { grid-template-columns: 1fr 1fr !important; }
      .summary-grid { grid-template-columns: 1fr 1fr !important; }
      .how-grid     { grid-template-columns: 1fr 1fr !important; }
      .d3-grid      { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 560px) {
      .pain-grid    { grid-template-columns: 1fr !important; }
