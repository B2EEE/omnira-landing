<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent vocal IA pour garage et centre auto | Omnira</title>
  <meta name="description" content="Omnira déploie un agent vocal IA pour les garages : répondre aux appels, qualifier les demandes de devis, prendre des rendez-vous et transmettre des résumés à l'atelier."/>
  <link rel="canonical" href="https://omniragency.com/agent-vocal-ia-garage"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="64x64" href="uploads/omnira-logo-transparent.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #0B1726; -webkit-font-smoothing: antialiased; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      .hero-grid    { grid-template-columns: 1fr !important; }
      .solution-grid{ grid-template-columns: 1fr !important; }
      .footer-grid  { grid-template-columns: 1fr !important; }
      .feat-grid    { grid-template-columns: 1fr 1fr !important; }
      .nav-links    { display: none !important; }
    }
    @media (max-width: 560px) {
      .feat-grid    { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components/brand.jsx"></script>
  <script type="text/babel" src="components/nav-hero.jsx"></script>
  <script type="text/babel" src="components/pricing-bottom.jsx"></script>
  <script type="text/babel">

    const APPELS_TYPES = [
      { label: 'Demande de devis freins / embrayage', desc: "L'agent collecte le véhicule, le kilométrage, le problème constaté et le numéro du client." },
      { label: 'Prise de rendez-vous vidange', desc: "L'agent vérifie la disponibilité selon vos règles, prend les infos et prépare la fiche atelier." },
      { label: 'Demande de révision ou contrôle technique', desc: "L'agent identifie la demande, pose les questions utiles et transmet un résumé à l'accueil." },
      { label: 'Appel hors horaires ou weekend', desc: "L'agent répond, collecte les infos et crée une demande de rappel pour le lendemain matin." },
      { label: 'Urgence panne ou accident', desc: "L'agent détecte l'urgence et transfère à un humain selon les règles définies, avec le contexte." },
    ];

    const FEATURES_GARAGE = [
      { title: 'Répondre aux appels atelier', desc: "L'agent décroche pour éviter les appels perdus pendant les interventions." },
      { title: 'Qualifier les demandes de devis', desc: "Véhicule, marque, modèle, kilométrage, problème — tout est collecté avant de mobiliser l'équipe." },
      { title: 'Préparer les rendez-vous', desc: "L'agent vérifie les règles définies et collecte les disponibilités du client." },
      { title: 'Gérer les appels hors horaires', desc: "Aucun appel ne tombe dans le vide le soir ou le weekend." },
      { title: 'Filtrer les urgences', desc: "Pannes ou accidents : l'agent transfère selon vos règles avec le contexte." },
      { title: 'Transmettre les résumés', desc: "Chaque appel devient une fiche exploitable envoyée à votre accueil ou atelier." },
    ];

    const FAQS = [
      { q: "L'agent peut-il prendre des rendez-vous directement ?", a: "Oui, si un agenda ou un système de réservation est connecté. La configuration est faite avec vous lors de la mise en place selon vos outils actuels." },
      { q: "Peut-il gérer les appels pendant les interventions ?", a: "C'est précisément pour ça qu'il est utile. Quand vous êtes sous un véhicule ou en intervention, l'agent répond, qualifie et transmet — sans interrompre votre équipe." },
      { q: "Que se passe-t-il en cas d'urgence ou d'accident ?", a: "Les règles de transfert sont définies avec vous. L'agent peut détecter les mots-clés d'urgence et transférer l'appel à un humain avec le contexte disponible." },
      { q: "L'agent connaît-il les marques et modèles ?", a: "L'agent pose les questions que vous lui avez définies : marque, modèle, kilométrage, problème constaté. Il ne fait pas de diagnostic mécanique, il structure la demande." },
      { q: "Peut-il préparer un devis ?", a: "Il collecte les informations nécessaires et transmet une demande structurée à votre équipe. La préparation du devis reste à votre charge, sur la base d'un dossier complet." },
    ];

    function GarageFeatureCard({ title, desc }) {
      return (
        <div style={{padding:'20px',borderRadius:'16px',background:B.bgW,border:`1px solid ${B.border}`,boxShadow:B.shadow,transition:'all 0.2s ease'}}
          onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 12px 36px rgba(30,115,216,0.1)';e.currentTarget.style.borderColor='rgba(30,115,216,0.2)';e.currentTarget.style.transform='translateY(-2px)';}}
          onMouseLeave={e=>{e.currentTarget.style.boxShadow=B.shadow;e.currentTarget.style.borderColor=B.border;e.currentTarget.style.transform='translateY(0)';}}>
          <div style={{width:'36px',height:'36px',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(30,115,216,0.07)',border:'1.5px solid rgba(30,115,216,0.14)',color:B.blue,marginBottom:'12px'}}>
            <Ico.Zap/>
          </div>
          <h3 style={{fontFamily:'Sora,sans-serif',fontSize:'13px',fontWeight:700,color:B.tMain,marginBottom:'6px'}}>{title}</h3>
          <p style={{fontFamily:'Inter,sans-serif',fontSize:'12px',color:B.tMuted,lineHeight:1.6}}>{desc}</p>
        </div>
      );
    }

    function GarageFAQ() {
      const [open, setOpen] = React.useState(null);
      return (
        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
          {FAQS.map(({q,a},i)=>(
            <div key={i} style={{borderRadius:'14px',overflow:'hidden',border:`1px solid ${open===i?'rgba(30,115,216,0.28)':B.border}`,transition:'border-color 0.2s',boxShadow:open===i?'0 8px 28px rgba(30,115,216,0.08)':B.shadow}}>
              <button onClick={()=>setOpen(open===i?null:i)} style={{width:'100%',padding:'16px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'16px',background:B.bgW,border:'none',cursor:'pointer',textAlign:'left'}}>
                <span style={{fontFamily:'Sora,sans-serif',fontSize:'14px',fontWeight:700,color:B.tMain,flex:1,lineHeight:1.4}}>{q}</span>
                <div style={{width:'24px',height:'24px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,background:open===i?B.grad:B.bgL,border:`1px solid ${open===i?'transparent':B.border}`,transition:'all 0.2s',transform:open===i?'rotate(45deg)':'rotate(0deg)'}}>
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 2v6M2 5h6" stroke={open===i?'white':B.tMuted} strokeWidth="1.5" strokeLinecap="round"/></svg>
                </div>
              </button>
              {open===i && (
                <div style={{padding:'0 20px 16px',background:B.bgW}}>
                  <p style={{fontFamily:'Inter,sans-serif',fontSize:'13px',lineHeight:1.7,color:B.tMuted,margin:0,paddingTop:'10px',borderTop:`1px solid ${B.border}`}}>{a}</p>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    function GaragePage() {
      return (
        <main style={{paddingTop:'80px',background:B.bgW}}>
          {/* Hero */}
          <section style={{padding:'80px 24px 96px',background:B.bgD,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 70% 50% at 50% 0%,rgba(30,115,216,0.18),transparent 60%)',pointerEvents:'none'}}/>
            <div style={{position:'absolute',inset:0,backgroundImage:'linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px)',backgroundSize:'64px 64px'}}/>
            <div style={{maxWidth:'1100px',margin:'0 auto',position:'relative',zIndex:1}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'64px',alignItems:'center'}} className="hero-grid">
                <div>
                  <div style={{marginBottom:'18px'}}><Chip color={B.cyan}>Garage & Centre auto</Chip></div>
                  <h1 style={{fontFamily:'Sora,sans-serif',fontSize:'clamp(28px,3.6vw,46px)',fontWeight:800,color:'white',letterSpacing:'-0.022em',lineHeight:1.12,marginBottom:'20px'}}>
                    Agent vocal IA pour<br/>
                    <span style={{background:`linear-gradient(135deg,#1E73D8,#2FC7D6)`,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>
                      garages et centres auto
                    </span>
                  </h1>
                  <p style={{fontFamily:'Inter,sans-serif',fontSize:'16px',color:'rgba(255,255,255,0.45)',lineHeight:1.75,marginBottom:'32px'}}>
                    Conçu pour les garages qui veulent mieux gérer leurs appels entrants sans saturer l'accueil ou interrompre l'atelier. L'agent répond, qualifie et transmet — vous intervenez sur les cas qui le nécessitent.
                  </p>
                  <div style={{display:'flex',flexWrap:'wrap',gap:'12px'}}>
                    <GBtn href="/devis" variant="primary" size="md">Demander un devis personnalisé</GBtn>
                    <GBtn onClick={() => window.openCalModal('decouverte')} variant="outline" size="md">Réserver une démo</GBtn>
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
                  {['Appels reçus même pendant les interventions','Demandes de devis qualifiées avant rappel','Rendez-vous préparés selon vos règles','Urgences filtrées et transmises à votre équipe'].map((t,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',gap:'12px',padding:'14px 18px',borderRadius:'14px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)'}}>
                      <div style={{width:'20px',height:'20px',borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(47,199,214,0.14)',border:'1px solid rgba(47,199,214,0.28)'}}>
                        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-5" stroke={B.cyan} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      </div>
                      <span style={{fontFamily:'Inter,sans-serif',fontSize:'14px',color:'rgba(255,255,255,0.6)',lineHeight:1.45}}>{t}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* Appels types */}
          <section style={{padding:'80px 24px',background:B.bgW}}>
            <div style={{maxWidth:'1100px',margin:'0 auto'}}>
              <FadeIn>
                <SectionHeader chip="Exemples d'appels" chipColor={B.blue} title="Les appels qu'Omnira<br/>gère pour votre garage" sub=""/>
              </FadeIn>
              <FadeIn delay={0.08}>
                <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                  {APPELS_TYPES.map(({label,desc},i)=>(
                    <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 1.4fr',gap:'20px',padding:'20px 24px',borderRadius:'16px',background:B.bgL,border:`1px solid ${B.border}`,alignItems:'center'}} className="solution-grid">
                      <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                        <div style={{width:'36px',height:'36px',borderRadius:'10px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(30,115,216,0.07)',color:B.blue}}>
                          <Ico.Phone/>
                        </div>
                        <span style={{fontFamily:'Sora,sans-serif',fontSize:'13px',fontWeight:700,color:B.tMain,lineHeight:1.35}}>{label}</span>
                      </div>
                      <p style={{fontFamily:'Inter,sans-serif',fontSize:'13px',color:B.tMuted,lineHeight:1.6,margin:0}}>{desc}</p>
                    </div>
                  ))}
                </div>
              </FadeIn>
            </div>
          </section>

          {/* Features */}
          <section style={{padding:'80px 24px',background:B.bgL}} className="section-cap-top">
            <div style={{maxWidth:'1100px',margin:'0 auto'}}>
              <FadeIn>
                <SectionHeader chip="Fonctionnalités" chipColor={B.blue} title="Ce que l'agent gère pour votre garage" sub="Chaque action est définie avec vous selon votre organisation."/>
              </FadeIn>
              <FadeIn delay={0.08}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'14px',marginBottom:'28px'}} className="feat-grid">
                  {FEATURES_GARAGE.map((f,i)=><GarageFeatureCard key={i} {...f}/>)}
                </div>
              </FadeIn>
              <FadeIn delay={0.18}>
                <div style={{padding:'16px 20px',borderRadius:'12px',background:B.bgW,border:`1px solid ${B.border}`,display:'flex',alignItems:'center',gap:'12px'}}>
                  <div style={{color:B.cyan,flexShrink:0}}><Ico.Shield/></div>
                  <p style={{fontFamily:'Inter,sans-serif',fontSize:'13px',color:B.tMuted,margin:0}}>
                    <strong style={{color:B.tMain}}>L'agent ne remplace pas votre expert.</strong>{' '}
                    Il filtre et transmet — les diagnostics, devis définitifs et cas sensibles restent pour votre équipe.
                  </p>
                </div>
              </FadeIn>
            </div>
          </section>

          {/* FAQ */}
          <section style={{padding:'80px 24px',background:B.bgW}}>
            <div style={{maxWidth:'780px',margin:'0 auto'}}>
              <FadeIn>
                <SectionHeader chip="FAQ" chipColor={B.blue} title="Vos questions sur Omnira<br/>pour les garages" sub=""/>
              </FadeIn>
              <FadeIn delay={0.08}><GarageFAQ/></FadeIn>
            </div>
          </section>

          {/* CTA */}
          <section style={{padding:'80px 24px',background:B.bgD,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 60% 50% at 50% 0%,rgba(30,115,216,0.18),transparent 65%)',pointerEvents:'none'}}/>
            <div style={{maxWidth:'640px',margin:'0 auto',position:'relative',zIndex:1,textAlign:'center'}}>
              <FadeIn>
                <h2 style={{fontFamily:'Sora,sans-serif',fontSize:'clamp(24px,3.5vw,38px)',fontWeight:800,color:'white',letterSpacing:'-0.022em',lineHeight:1.2,marginBottom:'16px'}}>
                  Demandez un devis pour votre garage
                </h2>
                <p style={{fontFamily:'Inter,sans-serif',fontSize:'15px',color:'rgba(255,255,255,0.42)',lineHeight:1.7,marginBottom:'32px'}}>
                  Chaque déploiement est configuré selon votre activité, vos horaires et vos outils. Estimation personnalisée sans engagement.
                </p>
                <div style={{display:'flex',justifyContent:'center',flexWrap:'wrap',gap:'12px'}}>
                  <GBtn href="/devis" variant="primary" size="lg">Demander un devis personnalisé</GBtn>
                  <GBtn href="/prendre-rendez-vous" variant="outline" size="md">Réserver une démo</GBtn>
                </div>
              </FadeIn>
            </div>
          </section>
        </main>
      );
    }

    function App() {
      return (
        <div>
          <Nav/>
          <GaragePage/>
          <Footer/>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
