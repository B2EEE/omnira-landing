<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Démos audio — Omnira Agents vocaux IA</title>
  <meta name="description" content="Écoutez Omnira en situation réelle. Démos vocales par secteur d'activité : garage, restaurant, artisan, urgence."/>
  <link rel="canonical" href="https://omniragency.com/demo"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="64x64" href="uploads/omnira-logo-transparent.png"/>
  <link rel="apple-touch-icon" href="uploads/omnira-logo-transparent.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #0B1726; -webkit-font-smoothing: antialiased; }
    @keyframes barwave { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.75; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.5; transform: translateY(-50%) scale(1); } 50% { opacity: 1; transform: translateY(-50%) scale(1.04); } }
    @keyframes particleDrift { from { transform: translateY(0) translateX(0); opacity: 0.2; } to { transform: translateY(-18px) translateX(8px); opacity: 0.5; } }
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .solution-grid { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr !important; }
      .nav-links { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components/brand.jsx"></script>
  <script type="text/babel" src="components/nav-hero.jsx"></script>
  <script type="text/babel" src="components/pricing-bottom.jsx"></script>
  <script type="text/babel">

    const DEMO_CARDS_PAGE = [
      {
        id:'garage', color:B.blue, duration:'0:48', Icon:Ico.Car,
        title:'Démo garage',
        context:'Prise de rendez-vous pour une vidange ou une panne mécanique',
        steps:[
          {who:'client', text:"Bonjour, j'aurais besoin d'un rendez-vous pour une vidange sur ma Peugeot 308."},
          {who:'agent',  text:"Bonjour ! Bien sûr. Votre véhicule est diesel ou essence ?"},
          {who:'client', text:"Diesel, le 1.6 HDi 2019."},
          {who:'agent',  text:"Noté. Nous avons un créneau jeudi à 10h ou vendredi à 14h. Lequel vous convient ?"},
          {who:'client', text:"Jeudi 10h, c'est parfait."},
          {who:'agent',  text:"RDV confirmé jeudi à 10h pour la vidange de votre 308 HDi. Votre nom pour finaliser ?"},
        ],
        result:'RDV confirmé · Résumé transmis à l\'équipe',
      },
      {
        id:'restaurant', color:B.cyan, duration:'0:35', Icon:Ico.Utensils,
        title:'Démo restaurant',
        context:'Réservation de table pour plusieurs personnes un samedi soir',
        steps:[
          {who:'client', text:"Bonsoir, je voudrais réserver une table pour 4 personnes samedi soir."},
          {who:'agent',  text:"Bonsoir ! Pour samedi, à quelle heure souhaitez-vous venir ?"},
          {who:'client', text:"Vers 20h si possible."},
          {who:'agent',  text:"Nous avons de la disponibilité à 20h. Votre nom et un numéro pour confirmer ?"},
        ],
        result:'Réservation notée · Confirmation à envoyer',
      },
      {
        id:'artisan', color:B.lcyan, duration:'0:52', Icon:Ico.Wrench,
        title:'Démo artisan',
        context:"Demande de devis pour une intervention urgente à domicile",
        steps:[
          {who:'client', text:"Bonjour, j'ai une fuite sous l'évier depuis ce matin."},
          {who:'agent',  text:"Bonjour ! Quelle est l'adresse du domicile et s'agit-il d'une fuite active en ce moment ?"},
          {who:'client', text:"Oui, l'eau coule. Je suis au 14 rue des Lilas à Lyon."},
          {who:'agent',  text:"Noté. Je transmets votre demande comme urgente. Un technicien va vous rappeler dans les plus brefs délais. Votre numéro ?"},
        ],
        result:'Urgence signalée · Rappel prioritaire déclenché',
      },
      {
        id:'urgence', color:'#f59e0b', duration:'0:41', Icon:Ico.Zap,
        title:'Démo urgence',
        context:"Appel sensible détecté et transféré à un humain avec contexte",
        steps:[
          {who:'client', text:"J'ai besoin de parler à quelqu'un immédiatement, c'est urgent."},
          {who:'agent',  text:"Je comprends. Pouvez-vous me donner une idée de la situation pour que je vous oriente rapidement ?"},
          {who:'client', text:"C'est un client mécontent, il veut parler au responsable."},
          {who:'agent',  text:"Je vous transfère immédiatement avec le contexte. Ne quittez pas."},
        ],
        result:'Transfert humain · Contexte transmis',
      },
    ];

    function DemoCardFull({ card }) {
      const [playing, setPlaying] = React.useState(false);
      const [shown, setShown]     = React.useState(0);
      const timerRef = React.useRef(null);
      const bars = [4,7,11,15,12,9,14,8,12,6,13,10,7,11,5,8];

      const toggle = () => {
        if (playing) {
          clearInterval(timerRef.current);
          setPlaying(false);
          return;
        }
        setShown(0);
        setPlaying(true);
        let idx = 0;
        timerRef.current = setInterval(() => {
          idx++;
          if (idx >= card.steps.length) { clearInterval(timerRef.current); setPlaying(false); return; }
          setShown(idx);
        }, 1600);
      };
      React.useEffect(()=>()=>clearInterval(timerRef.current),[]);

      return (
        <div style={{borderRadius:'20px',overflow:'hidden',border:`1px solid ${B.border}`,boxShadow:'0 16px 48px rgba(16,63,115,0.08)'}}>
          <div style={{padding:'18px 24px',background:B.bgD,display:'flex',alignItems:'center',gap:'12px'}}>
            <div style={{display:'flex',gap:'6px'}}>
              <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#ef4444'}}/>
              <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#f59e0b'}}/>
              <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#22c55e'}}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:'10px',flex:1}}>
              <div style={{width:'28px',height:'28px',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',background:`${card.color}20`,color:card.color,flexShrink:0}}>
                <card.Icon/>
              </div>
              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'rgba(255,255,255,0.4)'}}>{card.title} · {card.context}</span>
            </div>
          </div>

          <div style={{padding:'24px',background:B.bgW}}>
            {/* Player row */}
            <div style={{display:'flex',alignItems:'center',gap:'16px',marginBottom:'20px',padding:'16px',borderRadius:'14px',background:B.bgL,border:`1px solid ${B.border}`}}>
              <button onClick={toggle} style={{width:'48px',height:'48px',borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:playing?`${card.color}18`:`linear-gradient(135deg,${card.color},${card.color}cc)`,border:'none',cursor:'pointer',transition:'all 0.18s',boxShadow:playing?'none':`0 4px 14px ${card.color}44`,color:playing?card.color:'white'}}
                onMouseEnter={e=>{if(!playing)e.currentTarget.style.transform='scale(1.06)';}}
                onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}>
                {playing
                  ? <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="4" height="12" rx="1.5"/><rect x="8" y="1" width="4" height="12" rx="1.5"/></svg>
                  : <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M2 1.5l11 5.5-11 5.5V1.5z"/></svg>}
              </button>
              <div style={{flex:1,display:'flex',alignItems:'center',gap:'3px',height:'32px'}}>
                {bars.map((h,i)=>(
                  <div key={i} style={{width:'3px',borderRadius:'99px',height:playing?`${h*1.6}px`:'3px',background:`${card.color}`,opacity:playing?0.8:0.3,animation:playing?`barwave ${0.5+i*0.055}s ease-in-out infinite`:'none',animationDelay:`${i*0.04}s`,transformOrigin:'center',transition:'height 0.3s,opacity 0.3s'}}/>
                ))}
              </div>
              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:B.tMuted,flexShrink:0}}>
                {playing?'En cours…':shown===card.steps.length-1?'Terminée':card.duration}
              </span>
            </div>

            {/* Transcript */}
            <div style={{display:'flex',flexDirection:'column',gap:'10px',minHeight:'160px'}}>
              {card.steps.slice(0,shown+1).map(({who,text},i)=>{
                const isAgent = who==='agent';
                return (
                  <div key={i} style={{display:'flex',gap:'8px',flexDirection:isAgent?'row-reverse':'row',animation:'slideIn 0.3s ease'}}>
                    <div style={{width:'24px',height:'24px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:'9px',fontWeight:700,background:isAgent?`linear-gradient(135deg,${card.color},${card.color}cc)`:'rgba(91,122,155,0.15)',color:isAgent?'white':B.tMuted,boxShadow:isAgent?`0 2px 6px ${card.color}44`:'none'}}>
                      {isAgent?'AI':'C'}
                    </div>
                    <div style={{maxWidth:'74%',padding:'9px 13px',borderRadius:'12px',fontSize:'13px',lineHeight:1.55,fontFamily:'Inter,sans-serif',background:isAgent?`${card.color}08`:`rgba(91,122,155,0.07)`,border:isAgent?`1px solid ${card.color}18`:`1px solid ${B.border}`,color:B.tMain}}>
                      {text}
                    </div>
                  </div>
                );
              })}
            </div>
            {shown>=card.steps.length-1 && (
              <div style={{marginTop:'14px',padding:'10px 14px',borderRadius:'10px',background:`${card.color}08`,border:`1px solid ${card.color}20`,display:'flex',alignItems:'center',gap:'8px'}}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3 3 6-6" stroke={card.color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',fontWeight:600,color:card.color}}>{card.result}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DemoPage() {
      return (
        <main style={{paddingTop:'80px',background:B.bgW}}>
          {/* Hero */}
          <section style={{padding:'80px 24px 64px',background:B.bgD,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 70% 40% at 50% 0%,rgba(30,115,216,0.18),transparent 60%)',pointerEvents:'none'}}/>
            <div style={{position:'absolute',inset:0,backgroundImage:'linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px)',backgroundSize:'64px 64px'}}/>
            <div style={{maxWidth:'700px',margin:'0 auto',textAlign:'center',position:'relative',zIndex:1}}>
              <div style={{marginBottom:'16px'}}><Chip color={B.cyan}>Démos vocales</Chip></div>
              <h1 style={{fontFamily:'Sora,sans-serif',fontSize:'clamp(28px,4vw,46px)',fontWeight:800,color:'white',letterSpacing:'-0.022em',lineHeight:1.15,marginBottom:'18px'}}>
                Écoutez Omnira<br/>en situation réelle
              </h1>
              <p style={{fontFamily:'Inter,sans-serif',fontSize:'16px',color:'rgba(255,255,255,0.42)',lineHeight:1.7}}>
                Quatre scénarios vocaux par secteur. Appuyez sur lecture pour simuler l'échange complet.
              </p>
            </div>
            <div style={{position:'absolute',bottom:0,left:0,right:0,pointerEvents:'none'}}>
              <svg viewBox="0 0 1440 48" fill="none" preserveAspectRatio="none" style={{width:'100%',height:'44px',display:'block'}}>
                <path d="M0 24 Q360 0 720 24 Q1080 48 1440 24 L1440 48 L0 48 Z" fill={B.bgW}/>
              </svg>
            </div>
          </section>

          {/* Demo cards */}
          <section style={{padding:'64px 24px 96px',background:B.bgW}}>
            <div style={{maxWidth:'1100px',margin:'0 auto'}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px',marginBottom:'56px'}} className="solution-grid">
                {DEMO_CARDS_PAGE.map(card=><DemoCardFull key={card.id} card={card}/>)}
              </div>

              {/* How it works */}
              <div style={{padding:'36px',borderRadius:'24px',background:B.bgL,border:`1px solid ${B.border}`,marginBottom:'40px'}}>
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.12em',color:B.blue,marginBottom:'20px'}}>Comment ces démos fonctionnent</p>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'20px'}} className="feat-grid" style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'20px'}}>
                  {[
                    {num:'01', title:'L\'agent décroche',     desc:"Sans délai, avec un accueil adapté à votre activité."},
                    {num:'02', title:'Il qualifie',            desc:"Il comprend le besoin, pose les bonnes questions, collecte les infos utiles."},
                    {num:'03', title:'Il transmet ou agit',   desc:"Il prépare un résumé, confirme un RDV ou transfère selon vos règles."},
                  ].map(({num,title,desc})=>(
                    <div key={num} style={{display:'flex',gap:'14px',alignItems:'flex-start'}}>
                      <div style={{width:'32px',height:'32px',borderRadius:'10px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:B.grad,color:'white',boxShadow:'0 4px 12px rgba(30,115,216,0.3)'}}>
                        <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',fontWeight:700}}>{num}</span>
                      </div>
                      <div>
                        <h3 style={{fontFamily:'Sora,sans-serif',fontSize:'14px',fontWeight:700,color:B.tMain,marginBottom:'5px'}}>{title}</h3>
                        <p style={{fontFamily:'Inter,sans-serif',fontSize:'13px',color:B.tMuted,lineHeight:1.6,margin:0}}>{desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{textAlign:'center'}}>
                <p style={{fontFamily:'Inter,sans-serif',fontSize:'15px',color:B.tMuted,marginBottom:'20px'}}>Vous souhaitez une démo adaptée à votre activité ?</p>
                <GBtn onClick={() => window.openCalModal('decouverte')} variant="primary" size="lg">Demander une démo personnalisée</GBtn>
              </div>
            </div>
          </section>
        </main>
      );
    }

    function App() {
      return (
        <div>
          <Nav/>
          <DemoPage/>
          <Footer/>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
