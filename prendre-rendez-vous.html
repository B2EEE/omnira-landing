<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prendre rendez-vous — Omnira</title>
  <meta name="description" content="Réservez un appel découverte (30 min) ou une demande de devis (45 min) avec Omnira. Choisissez le créneau qui vous convient."/>
  <link rel="canonical" href="https://omniragency.com/prendre-rendez-vous"/>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Accueil", "item": "https://omniragency.com/"},
      {"@type": "ListItem", "position": 2, "name": "Prendre rendez-vous", "item": "https://omniragency.com/prendre-rendez-vous"}
    ]
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="64x64" href="uploads/omnira-logo-transparent.png"/>
  <link rel="apple-touch-icon" href="uploads/omnira-logo-transparent.png"/>

  <!-- Open Graph -->
  <meta property="og:title" content="Prendre rendez-vous — Omnira"/>
  <meta property="og:description" content="Réservez un appel découverte ou une demande de devis. Choisissez votre créneau directement."/>
  <meta property="og:url" content="https://omniragency.com/prendre-rendez-vous"/>
  <meta property="og:type" content="website"/>
  <meta property="og:locale" content="fr_FR"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Cal.com embed queue (must be before embed.js loads) -->
  <script>
  (function(C,A,L){let p=function(a,ar){a.q.push(ar)};let d=C.document;C.Cal=C.Cal||function(){let cal=C.Cal;let ar=arguments;if(!cal.loaded){cal.ns={};cal.q=cal.q||[];d.head.appendChild(d.createElement("script")).src=A;cal.loaded=true}if(ar[0]===L){const api=function(){p(api,arguments)};const namespace=ar[1];api.q=api.q||[];if(typeof namespace==="string"){cal.ns[namespace]=cal.ns[namespace]||api;p(cal.ns[namespace],ar);p(cal,["-reset-persistent-query"])}else{p(cal,ar)}return}p(cal,ar)};})(window,"https://app.cal.com/embed/embed.js","init");
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #0B1726; -webkit-font-smoothing: antialiased; }

    @keyframes slideIn  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes glowPulse {
      0%,100% { box-shadow:0 6px 24px rgba(30,115,216,0.38),inset 0 1px 0 rgba(255,255,255,0.18); }
      50%      { box-shadow:0 10px 38px rgba(47,199,214,0.55),inset 0 1px 0 rgba(255,255,255,0.22); }
    }

    .btn-glow { animation: glowPulse 3s ease-in-out infinite; }

    /* Cal.com iframe container resets */
    .cal-embed-zone { width:100%; min-height:680px; }
    .cal-embed-zone iframe { border:none !important; }

    @media (max-width:900px) {
      .type-grid    { grid-template-columns: 1fr !important; }
      .nav-links    { display:none !important; }
      .info-grid    { grid-template-columns: 1fr !important; }
    }
    @media (max-width:600px) {
      .badges-row   { flex-direction:column !important; align-items:flex-start !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/brand.jsx"></script>
  <script type="text/babel" src="components/nav-hero.jsx"></script>
  <script type="text/babel" src="components/pricing-bottom.jsx"></script>

  <script type="text/babel">

    const RDV_TYPES = [
      {
        id: 'decouverte',
        slug: 'decouverte-omnira',
        calLink: 'babacar-faye-qh9cu1/decouverte-omnira',
        label: 'Appel découverte',
        duration: '30 min',
        Icon: Ico.Phone,
        color: B.blue,
        desc: 'Pour comprendre votre activité, vos appels et voir si Omnira peut vous aider.',
        points: [
          'Analyse de vos appels entrants',
          'Identification des demandes récurrentes',
          'Présentation des scénarios possibles',
          'Sans engagement — sans préparation requise',
        ],
      },
      {
        id: 'devis',
        slug: 'devis-omnira',
        calLink: 'babacar-faye-qh9cu1/devis-omnira',
        label: 'Demande de devis',
        duration: '45 min',
        Icon: Ico.Chart,
        color: B.cyan,
        desc: 'Pour obtenir une estimation personnalisée selon votre volume, vos outils et vos scénarios.',
        points: [
          'Diagnostic complet de votre situation',
          'Définition des scénarios à automatiser',
          'Liste des intégrations nécessaires',
          'Estimation de coût personnalisée',
        ],
      },
    ];

    function TypeCard({ type, selected, onClick }) {
      const active = selected === type.id;
      return (
        <button
          onClick={onClick}
          style={{
            display:'flex', flexDirection:'column', alignItems:'flex-start', gap:'0',
            padding:'24px 28px', borderRadius:'20px', cursor:'pointer', textAlign:'left',
            border:`2px solid ${active ? type.color : B.border}`,
            background: active ? `${type.color}0a` : B.bgW,
            boxShadow: active ? `0 8px 32px ${type.color}22` : B.shadow,
            transition:'all 0.22s cubic-bezier(0.34,1.56,0.64,1)',
            transform: active ? 'translateY(-2px)' : 'translateY(0)',
            width:'100%',
          }}
        >
          {/* Top row */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',marginBottom:'14px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
              <div style={{
                width:'40px',height:'40px',borderRadius:'12px',flexShrink:0,
                display:'flex',alignItems:'center',justifyContent:'center',
                background: active ? `${type.color}18` : B.bgL,
                border:`1px solid ${active ? type.color+'44' : B.border}`,
                color: active ? type.color : B.tMuted,
                transition:'all 0.2s',
              }}>
                <type.Icon/>
              </div>
              <div>
                <p style={{fontFamily:'Sora,sans-serif',fontSize:'15px',fontWeight:700,color:B.tMain,margin:'0 0 2px'}}>{type.label}</p>
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color: active ? type.color : B.tMuted,fontWeight:600,margin:0}}>{type.duration} · Google Meet</p>
              </div>
            </div>
            {/* Indicator */}
            <div style={{
              width:'20px',height:'20px',borderRadius:'50%',flexShrink:0,
              border:`2px solid ${active ? type.color : B.border}`,
              background: active ? type.color : 'transparent',
              display:'flex',alignItems:'center',justifyContent:'center',
              transition:'all 0.2s',
            }}>
              {active && (
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                  <path d="M2 5l2.5 2.5 3.5-4" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              )}
            </div>
          </div>
          <p style={{fontFamily:'Inter,sans-serif',fontSize:'13px',color:B.tMuted,lineHeight:1.6,margin:0}}>{type.desc}</p>
        </button>
      );
    }

    function CalEmbed({ type }) {
      const initialized = React.useRef({decouverte: false, devis: false});

      React.useEffect(() => {
        const t = type;
        if (initialized.current[t]) return;
        initialized.current[t] = true;

        const calLink = t === 'decouverte'
          ? 'babacar-faye-qh9cu1/decouverte-omnira'
          : 'babacar-faye-qh9cu1/devis-omnira';

        Cal('init', t, { origin: 'https://cal.com' });
        Cal.ns[t]('inline', {
          elementOrSelector: `#cal-embed-${t}`,
          calLink,
          layout: 'month_view',
        });
        Cal.ns[t]('ui', {
          theme: 'light',
          hideEventTypeDetails: false,
          layout: 'month_view',
          styles: { branding: { brandColor: '#1E73D8' } },
        });
      }, [type]);

      return (
        <div style={{width:'100%'}}>
          <div
            id="cal-embed-decouverte"
            className="cal-embed-zone"
            style={{display: type === 'decouverte' ? 'block' : 'none'}}
          />
          <div
            id="cal-embed-devis"
            className="cal-embed-zone"
            style={{display: type === 'devis' ? 'block' : 'none'}}
          />
        </div>
      );
    }

    function RDVPage() {
      const [selected, setSelected] = React.useState('decouverte');
      const activeType = RDV_TYPES.find(t => t.id === selected);

      return (
        <main style={{paddingTop:'80px',background:B.bgW,minHeight:'100vh'}}>

          {/* ── Dark header ── */}
          <section style={{padding:'64px 24px 56px',background:B.bgD,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 70% 50% at 50% 0%,rgba(30,115,216,0.18),transparent 65%)',pointerEvents:'none'}}/>
            <div style={{position:'absolute',inset:0,backgroundImage:'linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px)',backgroundSize:'64px 64px'}}/>
            <div style={{maxWidth:'900px',margin:'0 auto',position:'relative',zIndex:1,textAlign:'center'}}>
              <nav aria-label="Fil d’Ariane" style={{marginBottom:'34px',textAlign:'left',fontFamily:'Inter,sans-serif',fontSize:'13px',color:'rgba(255,255,255,0.65)'}}>
                <a href="/" style={{color:'#74dce6'}}>Accueil</a><span aria-hidden="true" style={{margin:'0 8px'}}>›</span><span aria-current="page">Prendre rendez-vous</span>
              </nav>
              <div style={{marginBottom:'18px'}}><Chip color={B.cyan}>Prendre rendez-vous</Chip></div>
              <h1 style={{fontFamily:'Sora,sans-serif',fontSize:'clamp(26px,3.8vw,44px)',fontWeight:800,color:'white',letterSpacing:'-0.022em',lineHeight:1.12,marginBottom:'18px',animation:'fadeUp 0.5s ease both'}}>
                Choisissez votre rendez-vous
              </h1>
              <p style={{fontFamily:'Inter,sans-serif',fontSize:'16px',color:'rgba(255,255,255,0.45)',lineHeight:1.75,maxWidth:'560px',margin:'0 auto 40px',animation:'fadeUp 0.5s 0.07s ease both'}}>
                Un appel découverte pour faire connaissance, ou une session plus approfondie pour préparer votre devis.
              </p>

              {/* Type selector */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',maxWidth:'740px',margin:'0 auto',animation:'fadeUp 0.5s 0.14s ease both'}} className="type-grid">
                {RDV_TYPES.map(t => (
                  <TypeCard key={t.id} type={t} selected={selected} onClick={() => setSelected(t.id)}/>
                ))}
              </div>
            </div>
          </section>

          {/* ── Info banner ── */}
          <div style={{background:B.bgL,borderBottom:`1px solid ${B.border}`,padding:'14px 24px'}}>
            <div style={{maxWidth:'900px',margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'12px'}} className="info-grid">
              <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                <div style={{width:'8px',height:'8px',borderRadius:'50%',background:B.cyan,boxShadow:`0 0 0 3px ${B.cyan}22`}}/>
                <span style={{fontFamily:'Sora,sans-serif',fontSize:'13px',fontWeight:700,color:B.tMain}}>{activeType.label}</span>
                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:B.tMuted}}>· {activeType.duration}</span>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:'10px'}} className="badges-row">
                {activeType.points.map((p,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:'6px'}}>
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                      <path d="M2 6l2.5 2.5 5.5-5" stroke={B.blue} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                    <span style={{fontFamily:'Inter,sans-serif',fontSize:'12px',color:B.tMuted}}>{p}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* ── Cal.com embed ── */}
          <section style={{background:B.bgW,padding:'0'}}>
            <CalEmbed type={selected}/>
          </section>

          {/* ── Fallback CTA ── */}
          <section style={{padding:'56px 24px 80px',background:B.bgL,borderTop:`1px solid ${B.border}`}}>
            <div style={{maxWidth:'560px',margin:'0 auto',textAlign:'center'}}>
              <p style={{fontFamily:'Inter,sans-serif',fontSize:'15px',color:B.tMuted,lineHeight:1.7,marginBottom:'8px'}}>
                Vous préférez décrire votre besoin par écrit ?
              </p>
              <p style={{fontFamily:'Inter,sans-serif',fontSize:'13px',color:B.tMuted,lineHeight:1.7,marginBottom:'28px'}}>
                Remplissez le formulaire de devis — nous revenons vers vous sous 24h.
              </p>
              <GBtn href="/devis" variant="outline" size="md">Remplir le formulaire de devis</GBtn>
            </div>
          </section>
        </main>
      );
    }

    function App() {
      return (
        <div>
          <Nav/>
          <RDVPage/>
          <Footer/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
